name: Build SF2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip SF2_ModMenu_UI_Project_v7_PhoneBuild.zip

      - name: Build APK
        run: gradle -p SF2_ModMenu_UI_Project_v7 :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SF2-ModMenu-APK
          path: SF2_ModMenu_UI_Project_v7/app/build/outputs/apk/debug/app-debug.apk
